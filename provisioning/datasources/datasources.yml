apiVersion: 1

datasources:
  - name: LynxDB
    type: lynxbase-lynxdb-datasource
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    # From a Grafana container, the host's LynxDB is reachable here on macOS.
    url: http://host.docker.internal:3100
    jsonData:
      timeField: _time
      messageField: _raw
      levelField: level
      maxLines: 1000
    secureJsonData:
      token: ''
